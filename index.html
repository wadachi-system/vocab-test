<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語確認テスト</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    margin: 0;
    padding: 16px;
    line-height: 1.5;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: #2563eb;
    font-size: 1.6rem;
    margin: 0 0 20px 0;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-blue { background: #2563eb; color: white; }
  .btn-green { background: #16a34a; color: white; }
  .btn-gray { background: #e2e8f0; color: #1a202c; margin-top: 10px; }
  #quiz { display: none; }

  .word {
    text-align: center;
    font-size: 1.35rem;
    font-weight: bold;
    padding: 12px 8px;
    height: 140px;
    line-height: 1.4;
    word-break: break-all;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  .answer {
    background: #dcfce7;
    padding: 10px 12px;
    border-radius: 8px;
    text-align: center;
    margin: 8px 0 12px 0;
    height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    visibility: hidden;
    overflow: hidden;
    box-sizing: border-box;
  }
  .answer.show { visibility: visible; }
  .answer-label {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 2px;
  }
  .answer-text {
    font-size: 1.1rem;
    font-weight: bold;
    color: #16a34a;
    line-height: 1.35;
    word-break: break-all;
  }
  .info {
    text-align: center;
    color: #64748b;
    font-size: 0.9rem;
    margin: 8px 0;
  }
  .button-area {
    position: relative;
    height: 52px;
    margin-top: 4px;
  }
  .button-area button {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
  }
  .hidden { visibility: hidden; }
</style>
</head>
<body>
<div class="container">
  <h1>英単語確認テスト</h1>

  <div id="menu" class="card">
    <label>テーマ番号（1〜60）</label>
    <input type="number" id="theme" value="1" min="1" max="60">

    <label>モード</label>
    <select id="mode">
      <option value="en2jp">英単語 → 日本語</option>
      <option value="jp2en">日本語 → 英単語</option>
    </select>
    <button class="btn-blue" onclick="startQuiz()">スタート</button>
    <p class="info" id="count">範囲内の単語数: 読み込み中...</p>
  </div>

  <div id="quiz" class="card">
    <p class="info" id="remain"></p>
    <div class="word" id="word">---</div>
    <div class="answer" id="answer-box">
      <div class="answer-label">答え</div>
      <div class="answer-text" id="answer"></div>
    </div>

    <div class="button-area">
      <button class="btn-blue" id="ans-btn" onclick="showAnswer()">答え</button>
      <button class="btn-green hidden" id="next-btn" onclick="nextWord()">次へ</button>
    </div>

    <button class="btn-gray" onclick="toMenu()">メニューに戻る</button>
  </div>

  <p class="info" style="margin-top:20px;">テーマ選択対応・GitHub Pages</p>
</div>

<script>
// テーマ番号 → [開始番号, 終了番号]
const THEME_RANGES = {
  1: [1, 19],
  2: [20, 46],
  3: [47, 64],
  4: [65, 119],
  5: [120, 163],
  6: [164, 220],
  7: [221, 243],
  8: [244, 273],
  9: [274, 346],
  10: [347, 383],
  11: [384, 398],
  12: [399, 440],
  13: [441, 467],
  14: [468, 502],
  15: [503, 519],
  16: [520, 535],
  17: [536, 553],
  18: [554, 582],
  19: [583, 626],
  20: [627, 638],
  21: [639, 674],
  22: [675, 690],
  23: [691, 713],
  24: [714, 727],
  25: [728, 736],
  26: [737, 776],
  27: [777, 798],
  28: [799, 853],
  29: [854, 890],
  30: [891, 934],
  31: [935, 958],
  32: [959, 983],
  33: [984, 1009],
  34: [1010, 1029],
  35: [1030, 1074],
  36: [1075, 1169],
  37: [1170, 1190],
  38: [1191, 1210],
  39: [1211, 1219],
  40: [1220, 1235],
  41: [1236, 1296],
  42: [1297, 1332],
  43: [1333, 1364],
  44: [1365, 1379],
  45: [1380, 1388],
  46: [1389, 1459],
  47: [1460, 1483],
  48: [1484, 1571],
  49: [1572, 1590],
  50: [1591, 1623],
  51: [1624, 1682],
  52: [1683, 1709],
  53: [1710, 1793],
  54: [1794, 1810],
  55: [1811, 1835],
  56: [1836, 1880],
  57: [1881, 1911],
  58: [1912, 1941],
  59: [1942, 1968],
  60: [1969, 99999]
};

let vocab = [];
let pool = [];
let mode = 'en2jp';

async function loadVocab() {
  try {
    const res = await fetch('words.json');
    vocab = await res.json();
    updateCount();
  } catch (e) {
    document.getElementById('count').textContent = '単語データの読み込みに失敗しました';
    console.error(e);
    alert('words.json の読み込みに失敗しました。');
  }
}

function getThemeRange(theme) {
  return THEME_RANGES[theme] || null;
}

function updateCount() {
  if (!vocab.length) return;
  const t = +document.getElementById('theme').value || 1;
  const range = getThemeRange(t);
  if (!range) {
    document.getElementById('count').textContent = 'テーマ番号が不正です';
    return;
  }
  const [start, end] = range;
  const n = vocab.filter(w => w.number >= start && w.number <= end).length;
  document.getElementById('count').textContent = `テーマ${t}（${start}〜${end === 99999 ? '末尾' : end}）: ${n}語`;
}

function startQuiz() {
  if (!vocab.length) {
    alert('単語データがまだ読み込まれていません');
    return;
  }
  const t = +document.getElementById('theme').value || 1;
  const range = getThemeRange(t);
  if (!range) {
    alert('テーマ番号は1〜60を入力してください');
    return;
  }
  const [start, end] = range;
  pool = vocab.filter(w => w.number >= start && w.number <= end);
  if (pool.length === 0) {
    alert('このテーマの単語が現在のデータにありません（後日更新予定）');
    return;
  }
  mode = document.getElementById('mode').value;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  nextWord();
}

function nextWord() {
  if (pool.length === 0) {
    alert('このテーマの単語をすべて出しました');
    toMenu();
    return;
  }
  const i = Math.floor(Math.random() * pool.length);
  const w = pool.splice(i, 1)[0];
  const wordEl = document.getElementById('word');
  const ansEl = document.getElementById('answer');
  if (mode === 'en2jp') {
    wordEl.textContent = w.english;
    ansEl.textContent = w.japanese;
  } else {
    wordEl.textContent = w.japanese;
    ansEl.textContent = w.english;
  }
  document.getElementById('answer-box').classList.remove('show');
  document.getElementById('ans-btn').classList.remove('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('remain').textContent = '残り: ' + (pool.length + 1) + '語';
}

function showAnswer() {
  document.getElementById('answer-box').classList.add('show');
  document.getElementById('ans-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
}

function toMenu() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
  pool = [];
}

document.getElementById('theme').oninput = updateCount;

loadVocab();
</script>
</body>
</html>
