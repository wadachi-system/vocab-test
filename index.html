<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語確認テスト</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f0f4f8;
    color: #1a202c;
    margin: 0;
    padding: 16px;
    line-height: 1.5;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    color: #2563eb;
    font-size: 1.6rem;
    margin: 0 0 20px 0;
  }
  .card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 14px;
    box-sizing: border-box;
  }
  .range {
    display: flex;
    gap: 10px;
  }
  .range > div { flex: 1; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-blue { background: #2563eb; color: white; }
  .btn-green { background: #16a34a; color: white; }
  .btn-gray { background: #e2e8f0; color: #1a202c; margin-top: 10px; }
  #quiz { display: none; }

  /* 問題文エリア：和英の長い日本語を想定して5行分固定 */
  .word {
    text-align: center;
    font-size: 1.35rem;
    font-weight: bold;
    padding: 12px 8px;
    height: 140px;           /* 約5行分 */
    line-height: 1.4;
    word-break: break-all;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }

  /* 答えエリア：3行分固定 */
  .answer {
    background: #dcfce7;
    padding: 10px 12px;
    border-radius: 8px;
    text-align: center;
    margin: 8px 0 12px 0;
    height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    visibility: hidden;
    overflow: hidden;
    box-sizing: border-box;
  }
  .answer.show { visibility: visible; }
  .answer-label {
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 2px;
  }
  .answer-text {
    font-size: 1.1rem;
    font-weight: bold;
    color: #16a34a;
    line-height: 1.35;
    word-break: break-all;
  }
  .info {
    text-align: center;
    color: #64748b;
    font-size: 0.9rem;
    margin: 8px 0;
  }
  .button-area {
    position: relative;
    height: 52px;
    margin-top: 4px;
  }
  .button-area button {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
  }
  .hidden { visibility: hidden; }
</style>
</head>
<body>
<div class="container">
  <h1>英単語確認テスト</h1>

  <div id="menu" class="card">
    <div class="range">
      <div>
        <label>開始番号</label>
        <input type="number" id="start" value="1" min="1" max="1235">
      </div>
      <div>
        <label>終了番号</label>
        <input type="number" id="end" value="100" min="1" max="1235">
      </div>
    </div>
    <label>モード</label>
    <select id="mode">
      <option value="en2jp">英単語 → 日本語</option>
      <option value="jp2en">日本語 → 英単語</option>
    </select>
    <button class="btn-blue" onclick="startQuiz()">スタート</button>
    <p class="info" id="count">範囲内の単語数: 計算中...</p>
  </div>

  <div id="quiz" class="card">
    <p class="info" id="remain"></p>
    <div class="word" id="word">---</div>
    <div class="answer" id="answer-box">
      <div class="answer-label">答え</div>
      <div class="answer-text" id="answer"></div>
    </div>

    <div class="button-area">
      <button class="btn-blue" id="ans-btn" onclick="showAnswer()">答え</button>
      <button class="btn-green hidden" id="next-btn" onclick="nextWord()">次へ</button>
    </div>

    <button class="btn-gray" onclick="toMenu()">メニューに戻る</button>
  </div>

  <p class="info" style="margin-top:20px;">GitHub Pages 対応・データ収集なし</p>
</div>

  const n = vocab.filter(w => w.number >= s && w.number <= e).length;
  document.getElementById('count').textContent = '範囲内の単語数: ' + n + '語';
}

function startQuiz() {
  const s = +document.getElementById('start').value || 1;
  const e = +document.getElementById('end').value || 100;
  pool = vocab.filter(w => w.number >= s && w.number <= e);
  if (pool.length === 0) {
    alert('指定範囲に単語がありません');
    return;
  }
  mode = document.getElementById('mode').value;
  document.getElementById('menu').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  nextWord();
}

function nextWord() {
  if (pool.length === 0) {
    alert('この範囲の単語をすべて出しました');
    toMenu();
    return;
  }
  const i = Math.floor(Math.random() * pool.length);
  const w = pool.splice(i, 1)[0];
  const wordEl = document.getElementById('word');
  const ansEl = document.getElementById('answer');
  if (mode === 'en2jp') {
    wordEl.textContent = w.english;
    ansEl.textContent = w.japanese;
  } else {
    wordEl.textContent = w.japanese;
    ansEl.textContent = w.english;
  }
  document.getElementById('answer-box').classList.remove('show');
  document.getElementById('ans-btn').classList.remove('hidden');
  document.getElementById('next-btn').classList.add('hidden');
  document.getElementById('remain').textContent = '残り: ' + (pool.length + 1) + '語';
}

function showAnswer() {
  document.getElementById('answer-box').classList.add('show');
  document.getElementById('ans-btn').classList.add('hidden');
  document.getElementById('next-btn').classList.remove('hidden');
}

function toMenu() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
  pool = [];
}

document.getElementById('start').oninput = updateCount;
document.getElementById('end').oninput = updateCount;
updateCount();
</script>
</body>
</html>
